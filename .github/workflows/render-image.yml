name: Publish canonical render image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push render image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.render
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jiegaosunny/thesis-formatting-skill-render:sha-${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}

      - name: Write canonical image reference
        shell: bash
        run: |
          printf '%s@%s\n' 'ghcr.io/jiegaosunny/thesis-formatting-skill-render' '${{ steps.build.outputs.digest }}' > image-reference.txt

      - name: Upload image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-image-reference
          path: image-reference.txt
