name: Publish canonical render image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push render image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.render
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jiegaosunny/thesis-formatting-skill-render:sha-${{ github.sha }}

      - name: Write canonical image reference
        shell: bash
        run: |
          printf '%s@%s\n' 'ghcr.io/jiegaosunny/thesis-formatting-skill-render' '${{ steps.build.outputs.digest }}' > image-reference.txt

      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: render-image-reference
          path: image-reference.txt
