name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_IMAGE: ghcr.io/jiegaosunny/thesis-formatting-skill-render@sha256:5866364e94961d3e8f33402985f4b2e900febb07a7503e83b8c957216c1c9d79

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.6.17"
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Run unit tests
        run: |
          mkdir -p ci-reports
          uv run --frozen pytest -m "not integration" --junitxml=ci-reports/unit.xml

      - name: Check documentation links and workflow policy
        run: uv run --frozen pytest tests/test_docs.py --junitxml=ci-reports/docs.xml

      - name: Run synthetic privacy scan
        run: |
          uv run --frozen thesis-format release-check examples \
            --profile rules/apple-university.yaml \
            --denylist tests/fixtures/privacy/synthetic-denylist.txt \
            --report ci-reports/privacy.json \
            --markdown ci-reports/privacy.md

      - name: Pull canonical render image
        run: docker pull ghcr.io/jiegaosunny/thesis-formatting-skill-render@sha256:5866364e94961d3e8f33402985f4b2e900febb07a7503e83b8c957216c1c9d79

      - name: Run render and demo integration in container
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$CANONICAL_IMAGE" \
            -lc 'uv sync --frozen --all-extras && uv run --frozen pytest tests/test_render.py tests/test_demo_e2e.py tests/test_privacy.py::test_committed_examples_pass_release_check_with_profile_and_denylist --junitxml=ci-reports/integration.xml'

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports
          path: ci-reports
          if-no-files-found: error
