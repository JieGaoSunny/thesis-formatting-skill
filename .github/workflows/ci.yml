name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_IMAGE: ghcr.io/jiegaosunny/thesis-formatting-skill-render@sha256:5866364e94961d3e8f33402985f4b2e900febb07a7503e83b8c957216c1c9d79

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.6.17"
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Install CJK figure font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run unit tests
        run: |
          mkdir -p ci-reports
          uv run --frozen pytest -m "not integration" --junitxml=ci-reports/unit.xml

      - name: Check documentation links and workflow policy
        run: uv run --frozen pytest tests/test_docs.py --junitxml=ci-reports/docs.xml

      - name: Run synthetic privacy scan
        run: |
          uv run --frozen thesis-format release-check examples \
            --profile rules/apple-university.yaml \
            --denylist tests/fixtures/privacy/synthetic-denylist.txt \
            --report ci-reports/privacy.json \
            --markdown ci-reports/privacy.md

      - name: Pull canonical render image
        run: docker pull ghcr.io/jiegaosunny/thesis-formatting-skill-render@sha256:5866364e94961d3e8f33402985f4b2e900febb07a7503e83b8c957216c1c9d79

      - name: Run render and demo integration in container
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$CANONICAL_IMAGE" \
            -lc 'uv sync --frozen --all-extras &&
              uv run --frozen pytest tests/test_render.py tests/test_demo_e2e.py tests/test_privacy.py::test_committed_examples_pass_release_check_with_profile_and_denylist --junitxml=ci-reports/integration.xml &&
              rm -rf ci-reports/acceptance-release &&
              mkdir -p ci-reports/acceptance-release &&
              (uv run thesis-format audit examples/before.docx --profile rules/apple-university.yaml --report ci-reports/acceptance-release/before-audit.json --markdown ci-reports/acceptance-release/before-audit.md; test $? -eq 1) &&
              uv run thesis-format format examples/before.docx --profile rules/apple-university.yaml --output ci-reports/acceptance-release/after.docx --report ci-reports/acceptance-release/transformation.json &&
              THESIS_RENDER_MODE=local uv run thesis-format export ci-reports/acceptance-release/after.docx --output ci-reports/acceptance-release/after.pdf --manifest ci-reports/acceptance-release/render-manifest.json --allow-noncanonical &&
              uv run thesis-format preview ci-reports/acceptance-release/after.pdf --manifest ci-reports/acceptance-release/render-manifest.json --output-dir ci-reports/acceptance-release/previews'

      - name: Privacy-scan generated acceptance release
        run: |
          test -d ci-reports/acceptance-release
          uv run --frozen thesis-format release-check ci-reports/acceptance-release \
            --profile rules/apple-university.yaml \
            --denylist tests/fixtures/privacy/synthetic-denylist.txt \
            --report ci-reports/generated-privacy.json \
            --markdown ci-reports/generated-privacy.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports
          path: ci-reports
          if-no-files-found: error
