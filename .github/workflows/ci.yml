name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_IMAGE: ghcr.io/jiegaosunny/thesis-formatting-skill-render@sha256:e2599328bedaafe9f2929e091f31359444c9ebefc84acebc14d55773fedc77bb
  CANONICAL_IMAGE_DIGEST: sha256:e2599328bedaafe9f2929e091f31359444c9ebefc84acebc14d55773fedc77bb

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.6.17"
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Install CJK figure font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run unit tests
        run: |
          mkdir -p ci-reports
          uv run --frozen pytest -m "not integration" --junitxml=ci-reports/unit.xml

      - name: Check documentation links and workflow policy
        run: uv run --frozen pytest tests/test_docs.py --junitxml=ci-reports/docs.xml

      - name: Run synthetic privacy scan
        run: |
          uv run --frozen thesis-format release-check examples \
            --profile rules/apple-university.yaml \
            --denylist tests/fixtures/privacy/synthetic-denylist.txt \
            --report ci-reports/privacy.json \
            --markdown ci-reports/privacy.md

      - name: Build acceptance DOCX locally
        run: |
          rm -rf ci-reports/acceptance-release ci-reports/canonical-smoke
          mkdir -p ci-reports/acceptance-release ci-reports/canonical-smoke
          set +e
          uv run --frozen thesis-format audit examples/before.docx \
            --profile rules/apple-university.yaml \
            --report ci-reports/acceptance-release/before-audit.json \
            --markdown ci-reports/acceptance-release/before-audit.md
          status=$?
          set -e
          test "$status" -eq 1
          uv run --frozen thesis-format format examples/before.docx \
            --profile rules/apple-university.yaml \
            --output ci-reports/acceptance-release/after.docx \
            --report ci-reports/acceptance-release/transformation.json
          cp ci-reports/acceptance-release/after.docx \
            ci-reports/canonical-smoke/after.docx

      - name: Resolve canonical image pin
        id: canonical
        run: |
          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path

          environment = json.loads(
              Path("render-environment.json").read_text(encoding="utf-8")
          )
          available = environment.get("canonical_container_status") == "published-pinned"
          if not available:
              raise SystemExit("canonical image is not published-pinned")
          if environment.get("canonical_image_reference") != os.environ["CANONICAL_IMAGE"]:
              raise SystemExit("CI canonical image does not match render-environment.json")
          if environment.get("canonical_image_digest") != os.environ["CANONICAL_IMAGE_DIGEST"]:
              raise SystemExit("CI canonical digest does not match render-environment.json")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"available={'true' if available else 'false'}\n")
              if available:
                  stream.write(
                      f"reference={environment['canonical_image_reference']}\n"
                  )
                  stream.write(
                      f"digest={environment['canonical_image_digest']}\n"
                  )
          PY

      - name: Pull canonical render image
        if: steps.canonical.outputs.available == 'true'
        run: docker pull "${{ steps.canonical.outputs.reference }}"

      - name: Run standalone canonical image smoke
        if: steps.canonical.outputs.available == 'true'
        run: |
          docker run --rm \
            -e "THESIS_RENDER_IMAGE_DIGEST=${{ steps.canonical.outputs.digest }}" \
            -v "$PWD/ci-reports/canonical-smoke:/workspace" \
            "${{ steps.canonical.outputs.reference }}" \
            export /workspace/after.docx \
              --output /workspace/after.pdf \
              --manifest /workspace/render-manifest.json
          docker run --rm \
            -e "THESIS_RENDER_IMAGE_DIGEST=${{ steps.canonical.outputs.digest }}" \
            -v "$PWD/ci-reports/canonical-smoke:/workspace" \
            "${{ steps.canonical.outputs.reference }}" \
            preview /workspace/after.pdf \
              --manifest /workspace/render-manifest.json \
              --output-dir /workspace/previews
          sudo chown -R "$(id -u):$(id -g)" ci-reports
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          from thesis_format.contracts import validate_render_manifest
          from thesis_format.render import require_canonical_render_manifest

          manifest = json.loads(
              Path("ci-reports/canonical-smoke/render-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          validate_render_manifest(manifest)
          require_canonical_render_manifest(manifest)
          PY
          cp ci-reports/canonical-smoke/after.pdf \
            ci-reports/acceptance-release/after.pdf
          cp ci-reports/canonical-smoke/render-manifest.json \
            ci-reports/acceptance-release/render-manifest.json
          cp -R ci-reports/canonical-smoke/previews \
            ci-reports/acceptance-release/previews

      - name: Privacy-scan generated acceptance release
        if: steps.canonical.outputs.available == 'true'
        run: |
          test -d ci-reports/acceptance-release
          uv run --frozen thesis-format release-check ci-reports/acceptance-release \
            --profile rules/apple-university.yaml \
            --denylist tests/fixtures/privacy/synthetic-denylist.txt \
            --report ci-reports/generated-privacy.json \
            --markdown ci-reports/generated-privacy.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports
          path: ci-reports
          if-no-files-found: error
