[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thesis-formatting-skill"
version = "0.1.0"
description = "DOCX thesis formatting skill with an Apple University fictional demonstration"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "lxml>=5.3,<6",
    "Pillow>=11,<12",
    "pikepdf>=9.4,<10",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[project.scripts]
thesis-format = "thesis_format.cli:main"

[tool.hatch.build]
include = [
    "src/thesis_format/**/*.py",
    "src/thesis_format/schemas/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_format"]
